[project]
name = "drivewise-car-shopping-agent"
version = "0.1.0"
description = "IEOR 4570 Project 1: a Gemini tool-calling car-shopping advisor"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
